server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        resolver 8.8.8.8 valid=30s ipv6=off;
        
        # URL pública de tu servicio Backend en Railway
        set $backend_upstream "https://practica2maestria-backend-production-1e88.up.railway.app";

        proxy_pass $backend_upstream/;
        proxy_ssl_server_name on;
        proxy_set_header Host practica2maestria-backend-production-1e88.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}