server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Resolver de Docker (127.0.0.11) o Railway (8.8.8.8)
        resolver 127.0.0.11 8.8.8.8 valid=30s ipv6=off;
        
        # Al meter la URL en una variable, Nginx no falla en el arranque aunque el host no responda de inmediato
        set $backend_upstream "http://backend:3001";

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}