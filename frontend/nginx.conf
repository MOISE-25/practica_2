server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Sirve la app de React (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reenvía las llamadas /api hacia el backend en Railway
    location /api/ {
        # Resolver de DNS para evitar que Nginx falle al arrancar si el host no responde
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream "http://practica2maestria-backend.railway.internal:8080";

        proxy_pass $backend_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}